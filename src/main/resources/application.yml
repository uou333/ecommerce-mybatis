server:
  port: 8080

spring:
  # 数据源配置：按本机 MySQL 实际情况修改 username / password / url 中的库名
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ecommerce_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis:
  # XML 映射文件所在位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名包，XML 中可直接写 Product 而不用全限定名
  type-aliases-package: com.ecommerce.entity
  configuration:
    # 下划线驼峰自动映射：category_id -> categoryId，image_url -> imageUrl，create_time -> createTime
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，便于实验中查看动态 SQL 生成结果
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
